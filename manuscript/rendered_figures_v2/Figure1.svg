<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <rect width="100%" height="100%" fill="white"/>
  <style>
    text{font-family:Arial,Helvetica,sans-serif;fill:#111}
    .title{font-size:28px;font-weight:700}
    .panel{font-size:22px;font-weight:700}
    .label{font-size:18px}
    .small{font-size:15px}
    .axis{stroke:#222;stroke-width:2}
    .thin{stroke:#555;stroke-width:1.5}
    .dash{stroke:#777;stroke-width:1.5;stroke-dasharray:6 6}
    .bar{fill:#595959}
    .light{fill:#d9d9d9;stroke:#444;stroke-width:1.2}
    .point{fill:#111}
  </style>
<text x="55" y="55" class="title" text-anchor="start">Figure 1. Readiness is measured before movement and tested by phase</text>
<text x="55" y="105" class="panel" text-anchor="start">A</text>
<text x="100" y="105" class="panel" text-anchor="start">Capture-time Durif readiness</text>
<line x1="140" y1="175" x2="500" y2="175" class="axis"/>
<circle cx="180" cy="175" r="23" class="light"/><circle cx="320" cy="175" r="23" class="light"/><circle cx="460" cy="175" r="23" class="light"/>
<text x="180" y="182" class="label" text-anchor="middle">FIII</text><text x="320" y="182" class="label" text-anchor="middle">FIV</text><text x="460" y="182" class="label" text-anchor="middle">FV</text>
<line x1="205" y1="175" x2="292" y2="175" class="axis"/><polygon points="292,175 282,168.33333333333334 282,181.66666666666666" fill="#222"/><line x1="345" y1="175" x2="432" y2="175" class="axis"/><polygon points="432,175 422,168.33333333333334 422,181.66666666666666" fill="#222"/>
<text x="180" y="225" class="small" text-anchor="middle">pre-migrant</text><text x="320" y="225" class="small" text-anchor="middle">advanced</text><text x="460" y="225" class="small" text-anchor="middle">advanced</text>

<text x="55" y="310" class="panel" text-anchor="start">B</text>
<text x="100" y="310" class="panel" text-anchor="start">Phase-resolved movement question</text>
<rect x="120" y="355" width="235" height="85" rx="12" class="light"/>
<rect x="470" y="355" width="235" height="85" rx="12" class="light"/>
<rect x="820" y="355" width="235" height="85" rx="12" class="light"/>
<text x="237" y="390" class="label" text-anchor="middle">Internal readiness</text><text x="237" y="418" class="small" text-anchor="middle">measured at capture</text>
<text x="587" y="390" class="label" text-anchor="middle">Migration activation</text><text x="587" y="418" class="small" text-anchor="middle">whether / when it starts</text>
<text x="937" y="390" class="label" text-anchor="middle">Post-activation progression</text><text x="937" y="418" class="small" text-anchor="middle">generic migration speed</text>
<line x1="355" y1="398" x2="462" y2="398" class="axis"/><polygon points="462,398 452,391.3333333333333 452,404.6666666666667" fill="#222"/><line x1="705" y1="398" x2="812" y2="398" class="axis"/><polygon points="812,398 802,391.3333333333333 802,404.6666666666667" fill="#222"/>

<text x="55" y="545" class="panel" text-anchor="start">C</text>
<text x="100" y="545" class="panel" text-anchor="start">Analysis universe</text>
<text x="130" y="600" class="label" text-anchor="start">6 projects</text>
<text x="350" y="600" class="label" text-anchor="start">575 stage-coded tracks</text>
<text x="680" y="600" class="label" text-anchor="start">Terminal non-membership is not treated as biological failure</text>
<text x="55" y="680" class="small" text-anchor="start">Main contrast: readiness → activation versus readiness → post-activation speed</text>
</svg>