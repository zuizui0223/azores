<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="650" viewBox="0 0 1120 650" role="img" aria-label="Analytic universe and separate migratory stage endpoints for six-project European eel study.">
<rect width="1120" height="650" fill="#FFFFFF"/>
<text x="51" y="58" font-size="25" font-family="Arial,Helvetica,sans-serif" font-weight="700" fill="#1D333E">Migration has distinct biological and observation endpoints</text>
<text x="51" y="88" font-size="15" font-family="Arial,Helvetica,sans-serif" fill="#61737B">Capture phenotype is measured before movement · each analysis uses its own eligible risk set</text>
<line x1="51" x2="1071" y1="106" y2="106" stroke="#CCD8DF"/>
<rect x="265" y="132" rx="14" width="590" height="111" fill="#EBF4F5" stroke="#95B4C0" stroke-width="1.5"/>
<text x="560" y="165" text-anchor="middle" font-size="15" font-weight="700" fill="#315364" font-family="Arial,Helvetica,sans-serif">SIX-PROJECT EUROPEAN EEL COHORT</text>
<text x="560" y="199" text-anchor="middle" font-size="28" font-weight="700" fill="#1E5569" font-family="Arial,Helvetica,sans-serif">575 evaluable FIII–FV tracks</text>
<text x="560" y="222" text-anchor="middle" font-size="14" fill="#597887" font-family="Arial,Helvetica,sans-serif">Capture stage + body condition → telemetry-defined endpoints</text>
<path d="M560 243V284 M160 284H960" stroke="#7A8D99" fill="none" stroke-width="2"/>
<line x1="173.5" x2="173.5" y1="284" y2="309" stroke="#7A8D99" stroke-width="2"/>
<g data-endpoint="Activation classification" data-n="525">
<rect x="59" y="309" width="229" height="186" rx="12" fill="#F1F7F8" stroke="#16718C" stroke-width="1.6"/>
<rect x="59" y="309" width="229" height="11" rx="5" fill="#16718C"/>
<text x="173.5" y="361" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" font-size="18" font-weight="700" fill="#1E3C49">Activation classification</text>
<text x="173.5" y="411" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" font-size="34" font-weight="700" fill="#16718C">n = 525</text>
<text x="173.5" y="454" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" font-size="13" fill="#59717C">multivariable logistic model</text>

</g><line x1="430.5" x2="430.5" y1="284" y2="309" stroke="#7A8D99" stroke-width="2"/>
<g data-endpoint="Behavioral onset" data-n="570">
<rect x="316" y="309" width="229" height="186" rx="12" fill="#F1F7F8" stroke="#16718C" stroke-width="1.6"/>
<rect x="316" y="309" width="229" height="11" rx="5" fill="#16718C"/>
<text x="430.5" y="361" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" font-size="18" font-weight="700" fill="#1E3C49">Behavioral onset</text>
<text x="430.5" y="411" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" font-size="34" font-weight="700" fill="#16718C">n = 570</text>
<text x="430.5" y="454" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" font-size="13" fill="#59717C">Cox model · 418 source-classified e</text>
<text x="430.5" y="472" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" font-size="13" fill="#59717C">vents</text>
</g><line x1="687.5" x2="687.5" y1="284" y2="309" stroke="#7A8D99" stroke-width="2"/>
<g data-endpoint="Whole-route speed" data-n="418">
<rect x="573" y="309" width="229" height="186" rx="12" fill="#FBF7F0" stroke="#996025" stroke-width="1.6"/>
<rect x="573" y="309" width="229" height="11" rx="5" fill="#996025"/>
<text x="687.5" y="361" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" font-size="18" font-weight="700" fill="#1E3C49">Whole-route speed</text>
<text x="687.5" y="411" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" font-size="34" font-weight="700" fill="#996025">n = 418</text>
<text x="687.5" y="454" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" font-size="13" fill="#59717C">activated fish only</text>

</g><line x1="944.5" x2="944.5" y1="284" y2="309" stroke="#7A8D99" stroke-width="2"/>
<g data-endpoint="Inter-station transit" data-n="411">
<rect x="830" y="309" width="229" height="186" rx="12" fill="#FBF7F0" stroke="#996025" stroke-width="1.6"/>
<rect x="830" y="309" width="229" height="11" rx="5" fill="#996025"/>
<text x="944.5" y="361" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" font-size="18" font-weight="700" fill="#1E3C49">Inter-station transit</text>
<text x="944.5" y="411" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" font-size="34" font-weight="700" fill="#996025">n = 411</text>
<text x="944.5" y="454" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" font-size="13" fill="#59717C">frozen per-eel positive transit sum</text>
<text x="944.5" y="472" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" font-size="13" fill="#59717C">mary</text>
</g><text x="58" y="538" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#244351">Biological comparison</text>
<text x="58" y="566" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#455D68">Pre-movement internal state: Does it rank entry into migration? Does it also rank realized movement speed?</text>
<text x="58" y="596" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#607884">Different endpoint sample sizes reflect measurement/risk-set eligibility, not inferred deaths or failed escapement.</text>
<text x="58" y="621" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#607884">Data source and numeric cohorts: manuscript/FIGURE_DATA_CONTRACT_V4.json · source-classified observational telemetry.</text>
</svg>