<svg xmlns="http://www.w3.org/2000/svg" width="1090" height="680" viewBox="0 0 1090 680" role="img" aria-label="Independent Dutch eel barriers: no convincing association of capture body condition with post-arrival missed opportunities, delays or matched gate-opening choice.">
