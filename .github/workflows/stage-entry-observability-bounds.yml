name: stage-entry-observability-bounds

on:
  push:
    paths:
      - "results/stage_specific_condition_gate_v1.json"
      - "results/receiver_witness_observability_v1.json"
      - "analysis/contracts/stage_entry_observability_bounds_v1.json"
      - "analysis/50_stage_entry_observability_bounds.py"
      - "analysis/tests/test_stage_entry_observability_bounds.py"
      - ".github/workflows/stage-entry-observability-bounds.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax preflight
        run: python -m py_compile analysis/50_stage_entry_observability_bounds.py analysis/tests/test_stage_entry_observability_bounds.py
      - name: Test sharp bound and integer relabel counts
        run: python analysis/tests/test_stage_entry_observability_bounds.py
      - name: Recompute silvering-stage observability bounds
        run: python analysis/50_stage_entry_observability_bounds.py
      - name: Compare recomputation to frozen canonical output
        run: |
          python - <<'PY'
          import json, math
          canonical=json.load(open("results/stage_entry_observability_bounds_v1.json"))
          computed=json.load(open("analysis/results/stage_entry_observability_bounds.json"))
          def equivalent(x,y,path="$"):
              if isinstance(x,dict) and isinstance(y,dict):
                  assert x.keys()==y.keys(),(path,"key drift",list(x),list(y))
                  for k in x:equivalent(x[k],y[k],path+"."+str(k))
              elif isinstance(x,list) and isinstance(y,list):
                  assert len(x)==len(y),(path,"length mismatch")
                  for i,(a,b) in enumerate(zip(x,y)):equivalent(a,b,f"{path}[{i}]")
              elif isinstance(x,(float,int)) and isinstance(y,(float,int)) and not isinstance(x,bool) and not isinstance(y,bool):
                  assert math.isclose(x,y,rel_tol=1e-12,abs_tol=1e-12),(path,x,y)
              else:
                  assert x==y,(path,x,y)
          equivalent(canonical,computed)
          print("PASS recomputation agrees with frozen 575-fish project and stage bounds")
          PY
      - name: Show compact audit
        run: |
          python - <<'PY'
          import json
          x=json.load(open("analysis/results/stage_entry_observability_bounds.json"))
          print(json.dumps({k:x[k] for k in ["stage_bounds","fv_minus_fiii_pooled","minimum_additional_longer_observed_fiii_negative_relabels_to_erase_fv_over_fiii","project_status_summary","project_level"]},indent=2))
          PY
      - name: Preserve result even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: azores-stage-entry-observability-bounds
          path: analysis/results/stage_entry_observability_bounds.json
