name: V5 condensed eel manuscript source and claim integrity

on:
  push:
    paths:
      - "manuscript/AZORES_PHASE_TRANSFER_MAIN_V5_DRAFT.md"
      - "manuscript/AZORES_V5_SUPPLEMENT_EVIDENCE_MAP.md"
      - "validation/verify_v5_main_source_integrity.py"
      - ".github/workflows/v5-condensed-main-science-qc.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scientific-source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate four published V4 source figures
        run: python manuscript/verify_v4_rendered_figures.py
      - name: Validate compact V5 source numerics and scientific claim boundaries
        run: python validation/verify_v5_main_source_integrity.py
      - name: Preserve V5 evidence-status audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: azores-v5-main-science-review
          retention-days: 90
          if-no-files-found: warn
          path: manuscript/V5_SCIENTIFIC_REVIEW_QC.json
