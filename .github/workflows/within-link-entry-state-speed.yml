name: within-link-entry-state-speed

on:
  push:
    paths:
      - "analysis/contracts/within_link_entry_state_speed_v1.json"
      - "analysis/contracts/within_link_speed_quality_sensitivity_v1.json"
      - "analysis/31_entry_state_score_transferability.py"
      - "analysis/32_cross_project_entry_state_score.py"
      - "analysis/33_within_link_entry_state_speed.py"
      - "analysis/34_within_link_speed_quality_sensitivity.py"
      - "analysis/35_within_link_fwl_numerical_audit.py"
      - ".github/workflows/within-link-entry-state-speed.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependency
        run: python -m pip install --disable-pip-version-check numpy
      - name: Run within-link entry-state speed audit
        run: python analysis/33_within_link_entry_state_speed.py
      - name: Show result
        run: cat analysis/results/within_link_entry_state_speed.json
      - name: Run post-hoc speed-quality sensitivity
        run: python analysis/34_within_link_speed_quality_sensitivity.py
      - name: Show speed-quality sensitivity
        run: cat analysis/results/within_link_speed_quality_sensitivity.json
      - name: Check FWL numerical equivalence
        run: python analysis/35_within_link_fwl_numerical_audit.py
      - name: Show FWL numerical audit
        run: cat analysis/results/within_link_fwl_numerical_audit.json
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: azores-within-link-entry-state-speed
          path: |
            analysis/results/within_link_entry_state_speed.json
            analysis/results/within_link_speed_quality_sensitivity.json
            analysis/results/within_link_fwl_numerical_audit.json
