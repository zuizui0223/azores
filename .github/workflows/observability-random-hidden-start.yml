name: observability-random-hidden-start

on:
  push:
    paths:
      - "analysis/47_observability_random_hidden_start_sensitivity.py"
      - "analysis/tests/test_observability_random_hidden_start_sensitivity.py"
      - "analysis/contracts/observability_random_hidden_start_sensitivity_v1.json"
      - ".github/workflows/observability-random-hidden-start.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependency
        run: python -m pip install --disable-pip-version-check numpy
      - name: Syntax preflight
        run: python -m py_compile analysis/46_observability_label_ambiguity_tipping.py analysis/47_observability_random_hidden_start_sensitivity.py analysis/tests/test_observability_random_hidden_start_sensitivity.py
      - name: Validate formula against direct AUC on all synthetic assignments
        run: python analysis/tests/test_observability_random_hidden_start_sensitivity.py
      - name: Run random-label sensitivity on source panel
        run: python analysis/47_observability_random_hidden_start_sensitivity.py
      - name: Show output
        if: always()
        run: cat analysis/results/observability_random_hidden_start_sensitivity.json || true
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: azores-observability-random-hidden-start
          path: analysis/results/observability_random_hidden_start_sensitivity.json
