name: receiver-witness-observability

on:
  push:
    paths:
      - "analysis/48_receiver_witness_observability.py"
      - "analysis/contracts/receiver_witness_observability_v1.json"
      - "analysis/tests/test_receiver_witness_observability.py"
      - ".github/workflows/receiver-witness-observability.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependency
        run: python -m pip install --disable-pip-version-check numpy
      - name: Check syntax
        run: python -m py_compile analysis/48_receiver_witness_observability.py analysis/tests/test_receiver_witness_observability.py
      - name: Check virtual station and receiver-witness rules
        run: python analysis/tests/test_receiver_witness_observability.py
      - name: Source-pinned six-project inventory
        run: python analysis/48_receiver_witness_observability.py
      - name: Show inventory
        if: always()
        run: cat analysis/results/receiver_witness_observability.json || true
      - name: Upload source-derived inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: azores-receiver-witness-observability
          path: analysis/results/receiver_witness_observability.json
