name: observability-label-ambiguity-tipping

on:
  push:
    paths:
      - "analysis/contracts/observability_label_ambiguity_tipping_v1.json"
      - "analysis/46_observability_label_ambiguity_tipping.py"
      - "analysis/tests/test_observability_label_ambiguity_tipping.py"
      - ".github/workflows/observability-label-ambiguity-tipping.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numeric dependency
        run: python -m pip install --disable-pip-version-check numpy
      - name: Syntax preflight
        run: python -m py_compile analysis/46_observability_label_ambiguity_tipping.py analysis/tests/test_observability_label_ambiguity_tipping.py
      - name: Exhaustive synthetic equivalence test
        run: python analysis/tests/test_observability_label_ambiguity_tipping.py
      - name: Evaluate 575 source eels
        run: python analysis/46_observability_label_ambiguity_tipping.py
      - name: Show output
        if: always()
        run: cat analysis/results/observability_label_ambiguity_tipping.json || true
      - name: Archive sensitivity
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: azores-observability-label-ambiguity-tipping
          path: analysis/results/observability_label_ambiguity_tipping.json
