name: manuscript-v4-qc

on:
  push:
    paths:
      - "manuscript/AZORES_PHASE_CONTROL_MANUSCRIPT_V4.md"
      - "manuscript/MANUSCRIPT_NUMERIC_CONTRACT_V4.json"
      - "manuscript/qc_manuscript_v4.py"
      - "results/entry_state_score_transferability_v1.json"
      - "results/cross_project_entry_state_score_v1.json"
      - "results/within_link_entry_state_speed_v1.json"
      - "results/within_link_speed_quality_sensitivity_v1.json"
      - "results/within_link_fwl_numerical_audit_v1.json"
      - "results/cross_project_condition_increment_v1.json"
      - "results/cross_project_condition_increment_project_robustness_v1.json"
      - "results/stage_specific_condition_gate_v1.json"
      - "results/stage_gate_context_matched_robustness_v1.json"
      - "results/continuous_morphology_condition_increment_v1.json"
      - "results/continuous_morphology_penalty_sensitivity_v1.json"
      - "results/seasonal_condition_interaction_v1.json"
      - "results/fixed_followup_condition_increment_v1.json"
      - "results/paired_temporal_endpoint_condition_v1.json"
      - "results/entrant_onset_latency_discrimination_v1.json"
      - "results/observability_selection_gate_v1.json"
      - "results/observability_project_composition_v1.json"
      - "analysis/46_observability_project_weight_decomposition.py"
      - "manuscript/FIGURE_DATA_CONTRACT_V4.json"
      - "results/dutch_condition_choice_test_v1.json"
      - "results/dutch_arrival_waiting_diagnostic_v1.json"
      - ".github/workflows/manuscript-v4-qc.yml"
  workflow_dispatch:

jobs:
  qc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reconstruct exact project-weight AUC accounting
        run: python analysis/46_observability_project_weight_decomposition.py
      - name: Run V4 manuscript QC
        run: python manuscript/qc_manuscript_v4.py
      - name: Show QC
        if: always()
        run: cat manuscript/MANUSCRIPT_QC_V4.json
      - name: Upload QC
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: azores-manuscript-v4-qc
          path: manuscript/MANUSCRIPT_QC_V4.json
