name: independent-data-audit

on:
  push:
    paths:
      - "analysis/02_fetch_public_comparative_data.py"
      - "analysis/03_stage_transition_gate.py"
      - "analysis/04_zenodo_header_probe.py"
      - "analysis/05_processed_panel_transition_audit.py"
      - ".github/workflows/independent-data-audit.yml"
  workflow_dispatch:

jobs:
  public-panel-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit Europe-wide eel Zenodo record
        run: python analysis/02_fetch_public_comparative_data.py
      - name: Probe raw detection schema without full download
        run: python analysis/04_zenodo_header_probe.py
      - name: Clone source study public processed repository
        run: git clone --depth 1 https://github.com/PieterjanVerhelst/eel-meta-analysis.git external/eel-meta-analysis
      - name: Audit yellow-at-tagging to classified-migration transitions
        run: |
          python analysis/05_processed_panel_transition_audit.py \
            --source-repo external/eel-meta-analysis
      - name: Upload audit
        uses: actions/upload-artifact@v4
        with:
          name: azores-independent-data-audit
          path: |
            data/external/silver_eel_meta/zenodo_metadata_audit.json
            analysis/results/eel_meta_header_probe.json
            analysis/results/processed_panel_transition_audit.json
