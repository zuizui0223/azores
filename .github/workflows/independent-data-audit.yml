name: independent-data-audit

on:
  push:
    paths:
      - "analysis/02_fetch_public_comparative_data.py"
      - "analysis/03_stage_transition_gate.py"
      - "analysis/04_zenodo_header_probe.py"
      - "analysis/05_processed_panel_transition_audit.py"
      - "analysis/06_build_stage_landscape_panel.py"
      - "analysis/14_stage_staleness_diagnostic.py"
      - "analysis/15_activation_filter_diagnostic.py"
      - "analysis/17_multivariate_readiness_gate_diagnostic.py"
      - "analysis/18_body_condition_onset_diagnostic.py"
      - "analysis/19_body_condition_metric_robustness.py"
      - "analysis/20_body_condition_post_activation_speed.py"
      - "analysis/21_body_condition_segment_progression.py"
      - "analysis/23_body_condition_whole_route_decomposition.py"
      - "analysis/25_body_condition_elapsed_components.py"
      - ".github/workflows/independent-data-audit.yml"
  workflow_dispatch:

jobs:
  public-panel-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install analysis dependency
        run: python -m pip install numpy
      - name: Audit Europe-wide eel Zenodo record
        run: python analysis/02_fetch_public_comparative_data.py
      - name: Probe raw detection schema without full download
        run: python analysis/04_zenodo_header_probe.py
      - name: Clone source study public processed repository
        run: git clone --depth 1 https://github.com/PieterjanVerhelst/eel-meta-analysis.git external/eel-meta-analysis
      - name: Audit physiological-stage to behavioral-migration transitions
        run: |
          python analysis/05_processed_panel_transition_audit.py \
            --source-repo external/eel-meta-analysis
      - name: Build descriptive state-landscape panel when eligible
        run: |
          python analysis/06_build_stage_landscape_panel.py \
            --source-repo external/eel-meta-analysis
      - name: Test whether capture-stage information decays with activation latency
        run: python analysis/14_stage_staleness_diagnostic.py
      - name: Show capture-stage staleness diagnostic
        run: cat analysis/results/stage_staleness_diagnostic.json
      - name: Test activation-filter selection
        run: python analysis/15_activation_filter_diagnostic.py
      - name: Show activation-filter diagnostic
        run: cat analysis/results/activation_filter_diagnostic.json
      - name: Test multivariate readiness-gate compensation
        run: python analysis/17_multivariate_readiness_gate_diagnostic.py
      - name: Show multivariate readiness-gate diagnostic
        run: cat analysis/results/multivariate_readiness_gate_diagnostic.json
      - name: Test body-condition consistency for migration onset
        run: python analysis/18_body_condition_onset_diagnostic.py
      - name: Show body-condition onset diagnostic
        run: cat analysis/results/body_condition_onset_diagnostic.json
      - name: Test body-condition metric robustness
        run: python analysis/19_body_condition_metric_robustness.py
      - name: Show body-condition metric robustness
        run: cat analysis/results/body_condition_metric_robustness.json
      - name: Test body-condition transfer to post-activation speed
        run: python analysis/20_body_condition_post_activation_speed.py
      - name: Show body-condition post-activation speed diagnostic
        run: cat analysis/results/body_condition_post_activation_speed.json
      - name: Test body-condition frozen segment progression
        run: python analysis/21_body_condition_segment_progression.py
      - name: Show body-condition segment progression audit
        run: cat analysis/results/body_condition_segment_progression.json
      - name: Decompose body-condition whole-route speed
        run: python analysis/23_body_condition_whole_route_decomposition.py
      - name: Show body-condition whole-route decomposition
        run: cat analysis/results/body_condition_whole_route_decomposition.json
      - name: Decompose body-condition elapsed-time components
        run: python analysis/25_body_condition_elapsed_components.py
      - name: Show body-condition elapsed-time components
        run: cat analysis/results/body_condition_elapsed_components.json
      - name: Upload audit
        uses: actions/upload-artifact@v4
        with:
          name: azores-independent-data-audit
          path: |
            data/external/silver_eel_meta/zenodo_metadata_audit.json
            analysis/results/eel_meta_header_probe.json
            analysis/results/processed_panel_transition_audit.json
            analysis/results/state_landscape_panel.csv
            analysis/results/state_landscape_panel.csv.summary.json
            analysis/results/stage_staleness_diagnostic.json
            analysis/results/activation_filter_diagnostic.json
            analysis/results/multivariate_readiness_gate_diagnostic.json
            analysis/results/body_condition_onset_diagnostic.json
            analysis/results/body_condition_metric_robustness.json
            analysis/results/body_condition_post_activation_speed.json
            analysis/results/body_condition_segment_progression.json
            analysis/results/body_condition_whole_route_decomposition.json
            analysis/results/body_condition_elapsed_components.json
