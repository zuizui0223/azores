name: entrant-onset-latency-discrimination

on:
  push:
    paths:
      - "analysis/contracts/entrant_onset_latency_discrimination_v1.json"
      - "analysis/31_entry_state_score_transferability.py"
      - "analysis/36_cross_project_condition_increment.py"
      - "analysis/42_fixed_followup_condition_increment.py"
      - "analysis/43_paired_temporal_endpoint_condition.py"
      - "analysis/44_entrant_onset_latency_discrimination.py"
      - "analysis/tests/test_entrant_onset_latency_discrimination.py"
      - ".github/workflows/entrant-onset-latency-discrimination.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numpy
        run: python -m pip install --disable-pip-version-check numpy
      - name: Syntax preflight
        run: python -m py_compile analysis/31_entry_state_score_transferability.py analysis/36_cross_project_condition_increment.py analysis/42_fixed_followup_condition_increment.py analysis/43_paired_temporal_endpoint_condition.py analysis/44_entrant_onset_latency_discrimination.py analysis/tests/test_entrant_onset_latency_discrimination.py
      - name: Synthetic latency tests
        run: python analysis/tests/test_entrant_onset_latency_discrimination.py
      - name: Evaluate onset timing among initiators
        run: python analysis/44_entrant_onset_latency_discrimination.py
      - name: Show result
        if: always()
        run: cat analysis/results/entrant_onset_latency_discrimination.json || true
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: entrant-onset-latency-discrimination
          path: analysis/results/entrant_onset_latency_discrimination.json
