name: fixed-followup-condition-increment

on:
  push:
    paths:
      - "analysis/contracts/fixed_followup_condition_increment_v1.json"
      - "analysis/31_entry_state_score_transferability.py"
      - "analysis/36_cross_project_condition_increment.py"
      - "analysis/42_fixed_followup_condition_increment.py"
      - "analysis/tests/test_fixed_followup_condition_increment.py"
      - ".github/workflows/fixed-followup-condition-increment.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy
      - name: Check syntax
        run: python -m py_compile analysis/31_entry_state_score_transferability.py analysis/36_cross_project_condition_increment.py analysis/42_fixed_followup_condition_increment.py analysis/tests/test_fixed_followup_condition_increment.py
      - name: Validate window cases and cluster inference
        run: python analysis/tests/test_fixed_followup_condition_increment.py
      - name: Analyze condition ranking within fixed followup windows
        run: python analysis/42_fixed_followup_condition_increment.py
      - name: Print results
        if: always()
        run: cat analysis/results/fixed_followup_condition_increment.json || true
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fixed-followup-condition-increment
          path: analysis/results/fixed_followup_condition_increment.json
